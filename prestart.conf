[Unit]
# The sensor bind moved to ov02c10-bind.service. It MUST run in the host mount
# namespace, but this unit ships ReadOnlyPaths=/sys (from the base
# v4l2-relayd@.service `ReadOnlyDirectories=/etc /sys`), so an ExecStartPre bind
# here silently fails with "Read-only file system" on every attempt. Depend on
# the dedicated, un-sandboxed service instead.
Wants=ov02c10-bind.service
After=ov02c10-bind.service

[Service]
# Clear stale CamHAL SysV SHM (key 0x43414d = "CAM", nattch=0) on every (re)start.
# icamerasrc/libcamhal leaves these behind on crash; a fresh init then finds a
# partially-initialised segment and throws std::invalid_argument in stoi().
# ipcrm works from here: SysV IPC is not mount-namespaced, and icamerasrc.conf
# sets PrivateIPC=no so this shares the host IPC namespace.
ExecStartPre=/bin/sh -c 'for id in $(ipcs -m | awk "/0x0043414d/ && \$6 == 0 {print \$2}"); do ipcrm -m "$id" || true; done'
